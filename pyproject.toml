[project]
name = "ds-ai-teaching"
version = "0.1.0"
description = "数据结构 × AI 优化：从底层实现到生产级应用"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.24",
    "matplotlib>=3.7",
]

[project.optional-dependencies]
torch = ["torch>=2.1"]
dev = ["pytest>=7.0", "ruff>=0.4"]

[tool.uv]
dev-dependencies = ["pytest>=7.0", "ruff>=0.4"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]